name: Swift Human Policy Research

# On a research branch only. Never deploy, merge, or modify the live engine.
on:
  push:
    branches: [research/lichess-human-policy-1850-2550]
    paths:
      - "scripts/human_policy/**"
      - "tests/python/test_human_policy.py"
      - ".github/workflows/human-policy-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU neural framework
        run: |
          python -m pip install -r scripts/human_policy/requirements.txt
      - name: Verify human policy data/model contracts
        run: python -m pytest -q tests/python/test_human_policy.py

  train-real-lichess-demo:
    needs: test-python
    if: contains(github.event.head_commit.message, '[train human policy]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r scripts/human_policy/requirements.txt
      - name: Collect 1850-2550 rated human games from official CC0 bulk archive
        run: |
          mkdir -p artifacts/human-policy
          python -m scripts.human_policy.collect \
            --input https://database.lichess.org/standard/lichess_db_standard_rated_2014-01.pgn.zst \
            --output artifacts/human-policy/games.jsonl --max-games 1500
      - name: Fit neural move preference model with held-out games
        run: |
          python -m scripts.human_policy.train \
            --games artifacts/human-policy/games.jsonl \
            --output artifacts/human-policy/human-model.json \
            --metrics artifacts/human-policy/metrics.json \
            --max-train-positions 14000 --max-eval-positions 1200 \
            --epochs 2 --batch-size 48 --seed 2026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-human-policy-lichess-2014-trained-prototype
          path: artifacts/human-policy
          retention-days: 30
          if-no-files-found: warn
