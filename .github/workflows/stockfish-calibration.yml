name: Swift 1650 Calibration

on:
  workflow_dispatch:
  push:
    branches:
      - calibration-stable-seed-20260920

jobs:
  stockfish-calibration:
    name: stockfish-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: strict
            require_target: "1"
          - mode: human
            require_target: "0"
    env:
      SWIFT_RUN_STOCKFISH_GATE: "1"
      SWIFT_CALIBRATION_MODE: ${{ matrix.mode }}
      SWIFT_CALIBRATION_REQUIRE_TARGET: ${{ matrix.require_target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Run 1650 calibration match
        run: pnpm exec vitest run tests/stockfish-gate.test.ts --config vitest.config.mts

      - name: Upload calibration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-calibration-${{ matrix.mode }}
          path: calibration-results/${{ matrix.mode }}.json
          if-no-files-found: warn
          retention-days: 30
