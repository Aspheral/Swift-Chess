name: Swift 1650 Calibration

on:
  workflow_dispatch:
  push:
    branches:
      - calibration-run-20260920-0518

jobs:
  stockfish-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SWIFT_RUN_STOCKFISH_GATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Run 1650 calibration match
        run: pnpm exec vitest run tests/stockfish-gate.test.ts --config vitest.config.mts
