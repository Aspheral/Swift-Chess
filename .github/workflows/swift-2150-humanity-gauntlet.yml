name: Swift 2150 Humanization and Tactics Gauntlet

# Research run: seven opponent strengths + four Swift self-play games.
# PR launch tests the exact proposed harness. This is not Chess.com Elo.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/swift-2150-humanity-gauntlet.yml"
      - "scripts/analyze-2150-games.py"
      - "tests/swift-2150-selfplay.test.ts"
      - "tests/stockfish-gate.test.ts"

permissions:
  contents: read

jobs:
  limited-stockfish:
    name: Stockfish UCI Elo ${{ matrix.elo }} vs Swift (2 games)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        elo: [1700, 1800, 1900, 2000, 2150, 2250, 2400]
    env:
      SWIFT_RUN_STOCKFISH_GATE: "1"
      SWIFT_CALIBRATION_MODE: "human"
      SWIFT_STOCKFISH_ELO: ${{ matrix.elo }}
      SWIFT_CALIBRATION_BATCH: "0"
      SWIFT_CALIBRATION_OPENING_PAIRS: "1"
      SWIFT_CALIBRATION_OPENING_START: "2"
      SWIFT_CALIBRATION_REQUIRE_TARGET: "0"
      SWIFT_MAX_PLIES: "500"
      SWIFT_CALIBRATION_TEST_TIMEOUT_MS: "6600000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - run: pnpm install --no-frozen-lockfile
      - name: Install independent UCI Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          if ! command -v stockfish >/dev/null; then
            sudo ln -s /usr/games/stockfish /usr/local/bin/stockfish
          fi
          printf 'uci\nquit\n' | stockfish | grep -m 1 '^id name'
      - name: Run two color-reversed games
        run: pnpm exec vitest run tests/stockfish-gate.test.ts --config vitest.config.mts
      - name: Preserve completed or unresolved games for honest reporting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-2150-stockfish-${{ matrix.elo }}
          path: calibration-results/human-elo-${{ matrix.elo }}-batch-0.json
          if-no-files-found: warn
          retention-days: 30

  self-play:
    name: Swift human profile vs itself (four openings)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SWIFT_RUN_2150_SELFPLAY: "1"
      SWIFT_SELFPLAY_MAX_PLIES: "500"
      SWIFT_LAB_BUDGET_SCALE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - run: pnpm install --no-frozen-lockfile
      - name: Run and record full human-profile self-play
        run: pnpm exec vitest run tests/swift-2150-selfplay.test.ts --config vitest.config.mts
      - name: Preserve all four self-play games
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-2150-selfplay
          path: calibration-results/2150-selfplay.json
          if-no-files-found: warn
          retention-days: 30

  analysis:
    name: Export PGNs and independent tactical review
    if: always()
    needs: [limited-stockfish, self-play]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: swift-2150-*
          path: game-downloads
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent analysis dependencies
        run: |
          python -m pip install python-chess==1.999
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          if ! command -v stockfish >/dev/null; then
            sudo ln -s /usr/games/stockfish /usr/local/bin/stockfish
          fi
      - name: Export all PGNs and inspect tactical losses
        run: python scripts/analyze-2150-games.py --input game-downloads --output 2150-review --depth 10
      - name: Keep PGNs and full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-2150-game-records-and-analysis
          path: 2150-review/
          if-no-files-found: warn
          retention-days: 30
