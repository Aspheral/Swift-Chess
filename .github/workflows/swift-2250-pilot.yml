name: Swift 2250 Strength Pilot

# This is an exploratory 32-game comparison, NOT a 2250 Elo certification.
# After the first PR-based launch, the jobs are returned to dispatch-only.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/swift-2250-pilot.yml"

jobs:
  match:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'experiment/2050-integrated-pilot-20261014')
    name: 2250-human-batch-${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { batch: 0, opening_start: 0 }
          - { batch: 1, opening_start: 4 }
          - { batch: 2, opening_start: 8 }
          - { batch: 3, opening_start: 2 }
    env:
      SWIFT_RUN_STOCKFISH_GATE: "1"
      SWIFT_STOCKFISH_ELO: "2250"
      SWIFT_CALIBRATION_MODE: "human"
      SWIFT_CALIBRATION_BATCH: ${{ matrix.batch }}
      SWIFT_CALIBRATION_REQUIRE_TARGET: "0"
      SWIFT_MAX_PLIES: "500"
      SWIFT_CALIBRATION_TEST_TIMEOUT_MS: "6600000"
      SWIFT_CALIBRATION_OPENING_PAIRS: "4"
      SWIFT_CALIBRATION_OPENING_START: ${{ matrix.opening_start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - run: pnpm install --no-frozen-lockfile
      - name: Install Stockfish 16 with UCI strength control
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          if ! command -v stockfish >/dev/null; then
            sudo ln -s /usr/games/stockfish /usr/local/bin/stockfish
          fi
          printf 'uci\nquit\n' | stockfish | grep -m 1 '^id name'
      - name: Play four paired openings in both colors
        run: pnpm exec vitest run tests/stockfish-gate.test.ts --config vitest.config.mts
      - name: Preserve individual games and move histories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-2250-pilot-batch-${{ matrix.batch }}
          path: calibration-results/human-elo-2250-batch-${{ matrix.batch }}.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: match
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.head_ref == 'experiment/2050-integrated-pilot-20261014') }}
    runs-on: ubuntu-latest
    env:
      SWIFT_STOCKFISH_ELO: "2250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: swift-2250-pilot-batch-*
          path: calibration-downloads
          merge-multiple: true
      - name: Validate every game and compute descriptive Elo
        run: node scripts/aggregate-2050-32.mjs calibration-downloads calibration-results/swift-2250-pilot-summary.json
      - name: Upload complete 2250 pilot scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-2250-pilot-summary
          path: calibration-results/swift-2250-pilot-summary.json
          retention-days: 30
          if-no-files-found: warn
