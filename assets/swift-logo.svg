<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Swift Chess logo</title>
  <desc id="desc">A stylized steel chess knight wrapped by a sweeping pink swift-shaped curve.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6f4"/>
      <stop offset="0.42" stop-color="#c9c5c9"/>
      <stop offset="0.7" stop-color="#85818a"/>
      <stop offset="1" stop-color="#f0edef"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c83f73"/>
      <stop offset="0.5" stop-color="#ed78a2"/>
      <stop offset="1" stop-color="#ffb0c9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#17151a" flood-opacity=".32"/>
    </filter>
  </defs>
  <circle cx="320" cy="320" r="285" fill="#17151a" stroke="#403b43" stroke-width="10"/>
  <circle cx="320" cy="320" r="252" fill="none" stroke="#706a73" stroke-opacity=".45" stroke-width="2"/>
