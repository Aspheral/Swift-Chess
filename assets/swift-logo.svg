  <path d="M377 207 C360 185 363 154 391 119 C410 96 433 84 461 80 C449 108 448 130 461 153 C476 180 494 199 520 215 C484 217 447 213 417 201" fill="url(#steel)" stroke="#4b4750" stroke-width="9" stroke-linejoin="round"/>
  <path d="M292 249 C323 225 360 218 396 229 C369 239 351 257 343 279 C326 325 330 367 359 403 C326 392 298 370 284 341 C269 310 271 273 292 249Z" fill="#aaa6ad" opacity=".72"/>
  <path d="M164 454 C244 451 305 430 342 397 C381 363 396 318 382 278 C371 247 350 229 326 216 C361 218 399 236 420 263 C447 299 445 346 424 383 C387 449 286 478 164 454Z" fill="none" stroke="url(#pink)" stroke-width="24" stroke-linecap="round"/>
  <path d="M134 494 C236 519 357 511 437 462 C490 430 527 386 548 333" fill="none" stroke="url(#pink)" stroke-width="14" stroke-linecap="round" opacity=".9"/>
